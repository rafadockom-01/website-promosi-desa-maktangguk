<section id="buku-tamu" class="guestbook">
  <div class="guestbook-card">

    <div class="guestbook-icon">📝</div>

    <div class="guestbook-title">
      <span>Buku Tamu</span>
      <h2>Desa Maktangguk</h2>
      <p>
        Silakan isi pesan atau saran Anda.
        Kami sangat menghargai setiap masukan dari Anda.
      </p>
    </div>

    <form
      action="https://script.google.com/macros/s/AKfycbwcw6BxBoJzYReMBTVdyyprPag16cqvoA302FrFnxKta6cFpU1Mm_FlVCcOQ-LBtFWl/exec"
      method="POST"
      target="hidden_iframe"
      id="bukuTamuForm"
      onsubmit="setTimeout(function(){
        alert('Pesan sudah dikirim!');
        document.getElementById('bukuTamuForm').reset();
      }, 1000);"
    >

      <div class="form-group">
        <label>👤 Nama</label>
        <input
          type="text"
          name="nama"
          placeholder="Masukkan nama Anda..."
          required
        >
      </div>

      <div class="form-group">
        <label>📍 Asal / Dusun</label>
        <input
          type="text"
          name="asal"
          placeholder="Contoh: Dusun Maktangguk..."
          required
        >
      </div>

      <div class="form-group">
        <label>💬 Pesan / Saran</label>
        <textarea
          name="pesan"
          placeholder="Tulis pesan atau saran Anda di sini..."
          required
        ></textarea>
      </div>

      <button type="submit">
        ➤ &nbsp; Kirim Pesan
      </button>

    </form>

    <iframe name="hidden_iframe" style="display:none;"></iframe>

  </div>
</section>
