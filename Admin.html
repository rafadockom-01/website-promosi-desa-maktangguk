<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Desa Maktangguk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#f5f7f2;
    color:#174d35;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        linear-gradient(rgba(3,70,43,.82),rgba(3,70,43,.82)),
        url("profile.6.jpg");
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
}

.login-card{
    width:100%;
    max-width:430px;
    background:white;
    padding:45px 35px;
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    text-align:center;
    position:relative;
    z-index:10;
}

.login-icon{
    width:85px;
    height:85px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#e8f2dc;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#17613e;
    font-size:38px;
}

.login-card h1{
    font-family:'DM Serif Display',serif;
    font-size:38px;
    margin-bottom:8px;
    color:#145536;
}

.login-card p{
    color:#718078;
    font-size:14px;
    margin-bottom:30px;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group i{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#54816a;
}

.input-group input{
    width:100%;
    height:52px;
    padding:0 50px;
    border:2px solid #dce5dc;
    border-radius:14px;
    outline:none;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    color:#174d35;
    background:white;
}

.input-group input:focus{
    border-color:#26784f;
}

.show-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#54816a;
    cursor:pointer;
    font-size:16px;
}

.login-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:#17613e;
    color:white;
    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#0d472d;
    transform:translateY(-2px);
}

.message{
    min-height:24px;
    margin-top:18px;
    font-size:14px;
    font-weight:600;
}

.message.success{
    color:#258052;
}

.message.error{
    color:#c43c3c;
}

/* DAUN */

.leaf{
    position:absolute;
    color:#d9ed70;
    opacity:.7;
    animation:jatuh linear infinite;
}

.leaf:nth-child(1){
    left:5%;
    font-size:28px;
    animation-duration:8s;
}

.leaf:nth-child(2){
    left:20%;
    font-size:20px;
    animation-duration:11s;
}

.leaf:nth-child(3){
    left:40%;
    font-size:30px;
    animation-duration:9s;
}

.leaf:nth-child(4){
    left:65%;
    font-size:22px;
    animation-duration:12s;
}

.leaf:nth-child(5){
    left:85%;
    font-size:32px;
    animation-duration:10s;
}

@keyframes jatuh{
    0%{
        top:-60px;
        transform:rotate(0deg);
    }

    100%{
        top:110%;
        transform:rotate(360deg);
    }
}

/* ================= DASHBOARD ================= */

#dashboardPage{
    display:none;
    min-height:100vh;
}

.dashboard-nav{
    background:#064d2f;
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.dashboard-logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'DM Serif Display',serif;
    font-size:25px;
}

.dashboard-logo i{
    color:#d9ef70;
}

.logout-btn{
    border:1px solid rgba(255,255,255,.5);
    background:transparent;
    color:white;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
}

.logout-btn:hover{
    background:white;
    color:#064d2f;
}

.dashboard-container{
    max-width:1250px;
    margin:auto;
    padding:45px 5%;
}

.dashboard-title{
    margin-bottom:30px;
}

.dashboard-title h1{
    font-family:'DM Serif Display',serif;
    font-size:45px;
    color:#145536;
}

.dashboard-title p{
    color:#718078;
    margin-top:5px;
}

/* STATISTIK */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:35px;
}

.stat-card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(20,80,50,.08);
    display:flex;
    align-items:center;
    gap:18px;
}

.stat-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:#e8f2dc;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#17613e;
    font-size:23px;
}

.stat-card h3{
    font-size:27px;
    color:#174d35;
}

.stat-card p{
    color:#758279;
    font-size:13px;
}

/* BUKU TAMU */

.guestbook{
    background:white;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(20,80,50,.08);
    overflow:hidden;
}

.guestbook-header{
    padding:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #edf0ec;
}

.guestbook-header h2{
    font-family:'DM Serif Display',serif;
    font-size:28px;
}

.search-box{
    position:relative;
}

.search-box i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#7a8980;
}

.search-box input{
    width:250px;
    height:42px;
    border:1px solid #dce4dc;
    border-radius:12px;
    padding:0 15px 0 40px;
    outline:none;
    font-family:'Montserrat',sans-serif;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#f5f8f3;
    color:#37634d;
    font-size:13px;
    text-align:left;
    padding:16px;
}

td{
    padding:17px 16px;
    border-top:1px solid #edf0ec;
    font-size:13px;
    color:#52685b;
}

tr.unread{
    background:#f8fcf5;
}

tr.unread td:first-child{
    border-left:4px solid #26784f;
}

.nama{
    color:#174d35;
    font-weight:700;
}

.pesan-singkat{
    max-width:280px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.badge.baru{
    background:#fff1d6;
    color:#a96d08;
}

.badge.dibaca{
    background:#e3f3e8;
    color:#26734b;
}

.badge.dibalas{
    background:#e5eefc;
    color:#315d9c;
}

.action-buttons{
    display:flex;
    gap:7px;
}

.action-btn{
    width:34px;
    height:34px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.view-btn{
    background:#e8f2dc;
    color:#17613e;
}

.reply-btn{
    background:#e5eefc;
    color:#315d9c;
}

.forward-btn{
    background:#f4eadb;
    color:#9b651b;
}

.delete-btn{
    background:#fde8e8;
    color:#c43c3c;
}

.action-btn:hover{
    transform:translateY(-2px);
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    z-index:999;
    inset:0;
    background:rgba(0,0,0,.5);
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal-content{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:22px;
    padding:30px;
    position:relative;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    border:none;
    background:none;
    font-size:25px;
    color:#718078;
    cursor:pointer;
}

.modal-content h2{
    font-family:'DM Serif Display',serif;
    font-size:32px;
    color:#145536;
    margin-bottom:22px;
}

.detail-row{
    margin-bottom:17px;
}

.detail-row label{
    display:block;
    color:#789084;
    font-size:12px;
    margin-bottom:5px;
    font-weight:600;
}

.detail-row div{
    color:#294f3b;
    line-height:1.7;
    font-size:14px;
}

.message-box{
    background:#f5f8f3;
    padding:15px;
    border-radius:12px;
}

.reply-area{
    margin-top:20px;
    border-top:1px solid #e7ece7;
    padding-top:20px;
}

.reply-area h3{
    font-size:16px;
    margin-bottom:10px;
    color:#174d35;
}

.reply-area textarea{
    width:100%;
    min-height:110px;
    border:1px solid #d8e2d9;
    border-radius:12px;
    padding:13px;
    resize:vertical;
    outline:none;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
}

.reply-area textarea:focus{
    border-color:#26784f;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.modal-btn{
    border:none;
    border-radius:11px;
    padding:11px 17px;
    cursor:pointer;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
}

.modal-reply{
    background:#17613e;
    color:white;
}

.modal-forward{
    background:#f4eadb;
    color:#855719;
}

.modal-close{
    background:#edf1ed;
    color:#52685b;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .dashboard-title h1{
        font-size:37px;
    }

    .guestbook-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-box,
    .search-box input{
        width:100%;
    }

    .dashboard-nav{
        padding:15px 5%;
    }

    .dashboard-logo{
        font-size:20px;
    }
}

@media(max-width:500px){

    .login-card{
        padding:35px 22px;
    }

    .login-card h1{
        font-size:32px;
    }

    .dashboard-container{
        padding:30px 4%;
    }

    .modal-content{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage">

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Admin Desa</h1>

        <p>
            Silakan masukkan password untuk masuk
            ke Dashboard Admin.
        </p>

        <form onsubmit="loginAdmin(event)">

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="off"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                >
                    <i class="fa-solid fa-eye" id="eyeIcon"></i>
                </button>

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                <i class="fa-solid fa-right-to-bracket"></i>
                &nbsp; Masuk Admin
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

    </div>

</section>


<!-- ================= DASHBOARD ================= -->

<section id="dashboardPage">

    <nav class="dashboard-nav">

        <div class="dashboard-logo">
            <i class="fa-solid fa-leaf"></i>
            Desa Maktangguk
        </div>

        <button
            class="logout-btn"
            onclick="logoutAdmin()"
        >
            <i class="fa-solid fa-right-from-bracket"></i>
            Keluar
        </button>

    </nav>


    <main class="dashboard-container">

        <div class="dashboard-title">

            <h1>Dashboard Admin</h1>

            <p>
                Kelola pesan dan Buku Tamu masyarakat Desa Maktangguk.
            </p>

        </div>


        <!-- STATISTIK -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div>
                    <h3 id="totalTamu">0</h3>
                    <p>Total Tamu</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div>
                    <h3 id="totalPesan">0</h3>
                    <p>Total Pesan</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-reply"></i>
                </div>

                <div>
                    <h3 id="totalBalasan">0</h3>
                    <p>Sudah Dibalas</p>
                </div>

            </div>

        </div>


        <!-- BUKU TAMU -->

        <section class="guestbook">

            <div class="guestbook-header">

                <h2>Buku Tamu</h2>

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari nama atau pesan..."
                        onkeyup="searchData()"
                    >

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Nama</th>
                            <th>Asal</th>
                            <th>Pesan</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="guestbookTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</section>


<!-- ================= DETAIL MODAL ================= -->

<div id="detailModal" class="modal">

    <div class="modal-content">

        <button
            class="close"
            onclick="closeModal()"
        >
            &times;
        </button>

        <h2>Detail Pesan</h2>

        <div class="detail-row">
            <label>Nama</label>
            <div id="detailNama"></div>
        </div>

        <div class="detail-row">
            <label>Asal</label>
            <div id="detailAsal"></div>
        </div>

        <div class="detail-row">
            <label>Pesan</label>
            <div
                id="detailPesan"
                class="message-box"
            ></div>
        </div>

        <div class="detail-row">
            <label>Status</label>
            <div id="detailStatus"></div>
        </div>

        <div class="detail-row">
            <label>Tanggapan Admin</label>
            <div
                id="detailTanggapan"
                class="message-box"
            ></div>
        </div>


        <!-- BALAS -->

        <div class="reply-area">

            <h3>
                <i class="fa-solid fa-reply"></i>
                Balas Pesan
            </h3>

            <textarea
                id="replyText"
                placeholder="Tulis tanggapan untuk masyarakat..."
            ></textarea>

            <div class="modal-buttons">

                <button
                    class="modal-btn modal-reply"
                    onclick="balasPesan()"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                    Kirim Balasan
                </button>

                <button
                    class="modal-btn modal-forward"
                    onclick="teruskanPesan()"
                >
                    <i class="fa-solid fa-share"></i>
                    Teruskan
                </button>

                <button
                    class="modal-btn modal-close"
                    onclick="closeModal()"
                >
                    Tutup
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* ================= GOOGLE APPS SCRIPT ================= */
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx77H1uU1k9wlR7aGUMnnr4QN3NFkGqfv2gkKvT7NBFDFA7b-VWNVdcwnlfwvy4jNWm/exec";

let guestbookData = [];
let selectedIndex = null;

/* ================= LOGIN ================= */
function loginAdmin(event){
    event.preventDefault();

    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    if(password === "Rafa2009"){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboardPage").style.display = "block";
        message.innerHTML = "";
        loadDashboard();
    }else{
        message.className = "message error";
        message.innerHTML = "❌ Password salah.";
    }
}

function togglePassword(){
    const input = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if(input.type === "password"){
        input.type = "text";
        icon.className = "fa-solid fa-eye-slash";
    }else{
        input.type = "password";
        icon.className = "fa-solid fa-eye";
    }
}

/* ================= LOAD DATA DARI GOOGLE SHEET ================= */
async function loadDashboard(){
    const tbody = document.getElementById("guestbookTable");
    tbody.innerHTML =
        '<tr><td colspan="5" style="text-align:center;padding:30px">⏳ Mengambil data dari Buku Tamu...</td></tr>';

    try{
        const response = await fetch(SCRIPT_URL + "?action=getMessages&_=" + Date.now(), {
            method:"GET",
            cache:"no-store"
        });

        const hasil = await response.json();

        if(!hasil.success){
            throw new Error(hasil.error || "Data tidak dapat diambil.");
        }

        guestbookData = Array.isArray(hasil.data) ? hasil.data : [];
        updateStats();
        tampilkanData(guestbookData);

    }catch(error){
        console.error(error);
        tbody.innerHTML =
            '<tr><td colspan="5" style="text-align:center;padding:30px;color:#c43c3c">❌ Gagal mengambil data. Pastikan Google Apps Script sudah mendukung GET/action=getMessages.</td></tr>';
        updateStats();
    }
}

function updateStats(){
    document.getElementById("totalTamu").textContent = guestbookData.length;
    document.getElementById("totalPesan").textContent = guestbookData.length;
    document.getElementById("totalBalasan").textContent =
        guestbookData.filter(item => item.status === "Sudah Dibalas").length;
}

/* ================= TAMPILKAN DATA ================= */
function tampilkanData(data){
    const tbody = document.getElementById("guestbookTable");

    if(!data.length){
        tbody.innerHTML =
            '<tr><td colspan="5" style="text-align:center;padding:30px;color:#718078">Belum ada pesan dari masyarakat.</td></tr>';
        return;
    }

    tbody.innerHTML = data.map((item) => {
        const realIndex = guestbookData.indexOf(item);
        const status = item.status || "Baru";
        const statusClass =
            status === "Sudah Dibalas" ? "dibalas" :
            status === "Sudah Dibaca" ? "dibaca" : "baru";

        return `
        <tr class="${status === "Baru" ? "unread" : ""}">
            <td class="nama">${escapeHTML(item.nama || "-")}</td>
            <td>${escapeHTML(item.asal || "-")}</td>
            <td class="pesan-singkat">${escapeHTML(item.pesan || "-")}</td>
            <td>
                <span class="badge ${statusClass}">
                    ${status === "Baru" ? "🟡" : status === "Sudah Dibalas" ? "🔵" : "🟢"}
                    ${escapeHTML(status)}
                </span>
            </td>
            <td>
                <div class="action-buttons">
                    <button class="action-btn view-btn" title="Lihat"
                        onclick="lihatPesan(${realIndex})">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                    <button class="action-btn reply-btn" title="Balas"
                        onclick="bukaBalas(${realIndex})">
                        <i class="fa-solid fa-reply"></i>
                    </button>
                    <button class="action-btn forward-btn" title="Teruskan"
                        onclick="bukaTeruskan(${realIndex})">
                        <i class="fa-solid fa-share"></i>
                    </button>
                    <button class="action-btn delete-btn" title="Hapus"
                        onclick="hapusData(${realIndex})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </td>
        </tr>`;
    }).join("");
}

/* ================= DETAIL ================= */
function lihatPesan(index){
    selectedIndex = index;
    const item = guestbookData[index];

    if(!item) return;

    document.getElementById("detailNama").textContent = item.nama || "-";
    document.getElementById("detailAsal").textContent = item.asal || "-";
    document.getElementById("detailPesan").textContent = item.pesan || "-";
    document.getElementById("detailStatus").textContent = item.status || "Baru";
    document.getElementById("detailTanggapan").textContent =
        item.tanggapan || "Belum ada tanggapan.";
    document.getElementById("replyText").value = "";

    document.getElementById("detailModal").style.display = "flex";

    /* Tandai dibaca di server */
    if((item.status || "Baru") === "Baru"){
        updateMessage(index, {
            status:"Sudah Dibaca",
            waktuDibaca:new Date().toLocaleString("id-ID")
        }, false);
    }
}

function bukaBalas(index){
    lihatPesan(index);
    setTimeout(() => document.getElementById("replyText").focus(), 100);
}

/* ================= UPDATE SERVER ================= */
async function updateMessage(index, fields, closeAfter=true){
    const item = guestbookData[index];
    if(!item) return false;

    try{
        const data = new URLSearchParams();
        data.append("action", "updateMessage");

        if(item.id !== undefined && item.id !== null && item.id !== ""){
            data.append("id", item.id);
        }else{
            data.append("row", item.row || index + 2);
        }

        Object.keys(fields).forEach(key => data.append(key, fields[key]));

        const response = await fetch(SCRIPT_URL, {
            method:"POST",
            headers:{
                "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"
            },
            body:data.toString()
        });

        const hasil = await response.json();

        if(!hasil.success){
            throw new Error(hasil.error || "Update gagal.");
        }

        Object.assign(item, fields);

        if(closeAfter){
            closeModal();
            loadDashboard();
        }else{
            updateStats();
            tampilkanData(guestbookData);
            document.getElementById("detailStatus").textContent = item.status || "Sudah Dibaca";
        }

        return true;

    }catch(error){
        console.error(error);
        alert("❌ Gagal memperbarui data: " + error.message);
        return false;
    }
}

/* ================= BALAS PESAN ================= */
async function balasPesan(){
    if(selectedIndex === null) return;

    const text = document.getElementById("replyText").value.trim();

    if(!text){
        alert("Silakan tulis tanggapan terlebih dahulu.");
        return;
    }

    const berhasil = await updateMessage(selectedIndex, {
        tanggapan:text,
        status:"Sudah Dibalas",
        waktuDibalas:new Date().toLocaleString("id-ID")
    });

    if(berhasil){
        alert("✅ Balasan berhasil disimpan.");
    }
}

/* ================= TERUSKAN ================= */
async function teruskanPesan(){

    const text = document.getElementById("replyText").value.trim();

    if(!text){
        alert("Tulis keterangan penerusan terlebih dahulu.");

function bukaTeruskan(index){

/* ================= HAPUS DATA ================= */
async function hapusData(index){
    const item = guestbookData[index];
    if(!item) return;

    const yakin = confirm("Apakah kamu yakin ingin menghapus pesan ini?");
    if(!yakin) return;

    try{
        const data = new URLSearchParams();
        data.append("action", "deleteMessage");

        if(item.id !== undefined && item.id !== null && item.id !== ""){
            data.append("id", item.id);
        }else{
            data.append("row", item.row || index + 2);
        }

        const response = await fetch(SCRIPT_URL, {
            method:"POST",
            headers:{
                "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"
            },
            body:data.toString()
        });

        const hasil = await response.json();

        if(!hasil.success){
            throw new Error(hasil.error || "Penghapusan gagal.");
        }

        alert("🗑️ Pesan berhasil dihapus.");
        loadDashboard();

    }catch(error){
        console.error(error);
        alert("❌ Gagal menghapus data: " + error.message);
    }
}

/* ================= CARI DATA ================= */
function searchData(){
    const keyword =
        document.getElementById("searchInput").value.toLowerCase().trim();

    const hasil = guestbookData.filter(item =>
        String(item.nama || "").toLowerCase().includes(keyword) ||
        String(item.asal || "").toLowerCase().includes(keyword) ||
        String(item.pesan || "").toLowerCase().includes(keyword) ||
        String(item.status || "").toLowerCase().includes(keyword)
    );

    tampilkanData(hasil);
}

/* ================= MODAL ================= */
function closeModal(){
    document.getElementById("detailModal").style.display = "none";
    selectedIndex = null;
}

/* ================= LOGOUT ================= */
function logoutAdmin(){
    const yakin = confirm("Yakin ingin keluar dari Admin?");
    if(!yakin) return;

    document.getElementById("dashboardPage").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("loginMessage").innerHTML = "";
    document.getElementById("password").value = "";
    guestbookData = [];
}

/* ================= AMANKAN TEKS ================= */
function escapeHTML(text){
    const div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
}

/* ================= KLIK LUAR MODAL ================= */
window.onclick = function(event){
    const modal = document.getElementById("detailModal");
    if(event.target === modal) closeModal();
};
