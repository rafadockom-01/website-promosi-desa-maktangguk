<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Desa Maktangguk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    min-height:100vh;

    background:
        linear-gradient(
            rgba(4,77,43,.92),
            rgba(2,54,35,.96)
        );

    color:white;
    overflow-x:hidden;
}

/* DAUN */

.leaf{
    position:fixed;
    top:-80px;

    color:#d9ef70;
    opacity:.5;

    pointer-events:none;

    animation:jatuh linear infinite;

    z-index:1;
}

.leaf:nth-child(1){
    left:5%;
    font-size:30px;
    animation-duration:9s;
}

.leaf:nth-child(2){
    left:25%;
    font-size:20px;
    animation-duration:12s;
    animation-delay:2s;
}

.leaf:nth-child(3){
    left:50%;
    font-size:28px;
    animation-duration:10s;
    animation-delay:3s;
}

.leaf:nth-child(4){
    left:75%;
    font-size:22px;
    animation-duration:13s;
    animation-delay:1s;
}

.leaf:nth-child(5){
    left:92%;
    font-size:32px;
    animation-duration:11s;
    animation-delay:4s;
}

@keyframes jatuh{

    0%{
        top:-80px;
        transform:translateX(0) rotate(0deg);
    }

    50%{
        transform:translateX(70px) rotate(180deg);
    }

    100%{
        top:110vh;
        transform:translateX(-50px) rotate(360deg);
    }

}

/* NAVBAR */

.navbar{
    position:relative;
    z-index:10;

    width:90%;
    margin:25px auto;

    min-height:70px;

    padding:0 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(3,65,40,.75);

    border:1px solid rgba(255,255,255,.3);

    backdrop-filter:blur(12px);

    border-radius:50px;
}

.logo{
    display:flex;
    align-items:center;

    gap:10px;

    color:white;
    text-decoration:none;

    font-family:'Playfair Display',serif;

    font-size:23px;
    font-weight:700;
}

.logo i{
    color:#d9ef70;
    font-size:29px;
}

.back{
    display:flex;
    align-items:center;
    gap:8px;

    color:white;
    text-decoration:none;

    padding:10px 18px;

    border:1px solid rgba(255,255,255,.4);

    border-radius:25px;

    font-size:14px;

    transition:.3s;
}

.back:hover{
    background:#f1d878;
    color:#145334;
}

/* ADMIN */

.admin-wrapper{
    min-height:calc(100vh - 130px);

    display:flex;

    justify-content:center;
    align-items:center;

    padding:40px 20px 70px;

    position:relative;

    z-index:5;
}

.admin-card{
    width:100%;
    max-width:470px;

    padding:45px 40px;

    text-align:center;

    background:#ffffff;

    color:#145536;

    border-radius:30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

/* ICON */

.admin-icon{
    width:90px;
    height:90px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eaf3d2;

    border:3px solid #d9ef70;

    border-radius:50%;

    color:#12603e;

    font-size:38px;
}

.admin-card h1{
    font-family:'DM Serif Display',serif;

    font-size:42px;

    color:#12603e;

    margin-bottom:8px;
}

.admin-subtitle{
    font-family:'Playfair Display',serif;

    font-style:italic;

    color:#718275;

    font-size:16px;

    margin-bottom:30px;
}

/* DEKORASI */

.decor{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    margin-bottom:28px;
}

.decor span{
    width:55px;
    height:2px;

    background:#d5b958;
}

.decor i{
    color:#b49637;
}

/* INPUT */

.input-group{
    text-align:left;

    margin-bottom:20px;
}

.input-group label{
    display:block;

    margin-bottom:8px;

    color:#315c48;

    font-size:14px;

    font-weight:600;
}

.input-box{
    position:relative;

    width:100%;
}

.lock-icon{
    position:absolute;

    left:17px;
    top:50%;

    transform:translateY(-50%);

    color:#639276;

    z-index:3;

    pointer-events:none;
}

.input-box input{
    width:100%;

    height:52px;

    padding:0 52px 0 48px;

    border:2px solid #dce7df;

    border-radius:15px;

    outline:none;

    background:white;

    font-family:'Montserrat',sans-serif;

    font-size:15px;

    color:#174f36;

    position:relative;

    z-index:1;

    transition:.3s;
}

.input-box input:focus{
    border-color:#4f956f;

    box-shadow:
        0 0 0 4px rgba(79,149,111,.1);
}

/* EYE */

.show-password{
    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;

    background:transparent;

    color:#789184;

    cursor:pointer;

    border-radius:10px;

    z-index:5;
}

.show-password:hover{
    background:#edf4ef;

    color:#12603e;
}

/* BUTTON */

.login-btn{
    width:100%;

    margin-top:8px;

    padding:16px;

    border:none;

    border-radius:17px;

    background:#12603e;

    color:white;

    font-family:'Montserrat',sans-serif;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.login-btn:hover{
    background:#0d4b30;

    transform:translateY(-3px);
}

.login-btn i{
    margin-right:8px;
}

/* HASIL PASSWORD */

.message{
    min-height:28px;

    margin-top:20px;

    font-size:16px;

    font-weight:700;
}

.success{
    color:#258052;
}

.error{
    color:#c74b4b;
}

/* FOOTER */

.footer{
    text-align:center;

    padding:20px;

    color:rgba(255,255,255,.75);

    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    .navbar{
        width:94%;

        padding:0 18px;

        min-height:62px;
    }

    .logo{
        font-size:18px;
    }

    .logo i{
        font-size:23px;
    }

    .back{
        padding:8px 13px;

        font-size:12px;
    }

    .admin-wrapper{
        padding:25px 15px 50px;
    }

    .admin-card{
        padding:35px 24px;

        border-radius:25px;
    }

    .admin-icon{
        width:75px;
        height:75px;

        font-size:30px;
    }

    .admin-card h1{
        font-size:35px;
    }

}

</style>
</head>

<body>

<!-- DAUN -->

<div class="leaf">
    <i class="fa-solid fa-leaf"></i>
</div>

<div class="leaf">
    <i class="fa-solid fa-leaf"></i>
</div>

<div class="leaf">
    <i class="fa-solid fa-leaf"></i>
</div>

<div class="leaf">
    <i class="fa-solid fa-leaf"></i>
</div>

<div class="leaf">
    <i class="fa-solid fa-leaf"></i>
</div>


<!-- NAVBAR -->

<nav class="navbar">

    <a href="index.html" class="logo">

        <i class="fa-solid fa-leaf"></i>

        Desa Maktangguk

    </a>

    <a href="index.html" class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Beranda

    </a>

</nav>


<!-- ADMIN -->

<main class="admin-wrapper">

    <div class="admin-card">

        <div class="admin-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>

        <h1>Admin</h1>

        <p class="admin-subtitle">
            Panel Pengelolaan Desa Maktangguk
        </p>

        <div class="decor">

            <span></span>

            <i class="fa-solid fa-leaf"></i>

            <span></span>

        </div>


        <form onsubmit="loginAdmin(event)">

            <div class="input-group">

                <label for="password">
                    Password Admin
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock lock-icon"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="off"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        aria-label="Tampilkan password">

                        <i
                            class="fa-solid fa-eye"
                            id="eye">
                        </i>

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Masuk sebagai Admin

            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>

    </div>

</main>


<!-- FOOTER -->

<footer class="footer">

    ©️ 2026 Desa Maktangguk

</footer>


<script>

function loginAdmin(event){

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(password === "Rafa2009"){

        message.className =
            "message success";

        message.innerHTML =
            "✅ Password Benar";

    }else{

        message.className =
            "message error";

        message.innerHTML =
            "❌ Password Salah";

    }

}


function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");

        eye.classList.add("fa-eye-slash");

    }else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");

        eye.classList.add("fa-eye");

    }

}

</script>

</body>
</html>
