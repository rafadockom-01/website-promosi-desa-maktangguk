<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Desa Maktangguk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    background:#f5f7f2;
    color:#174f36;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    background:
        linear-gradient(
            rgba(4,77,43,.94),
            rgba(2,54,35,.97)
        );

    position:relative;
    overflow:hidden;
}

.leaf{
    position:absolute;
    color:#d9ef70;
    opacity:.45;
    pointer-events:none;
    animation:jatuh linear infinite;
}

.leaf:nth-child(1){
    left:5%;
    font-size:30px;
    animation-duration:9s;
}

.leaf:nth-child(2){
    left:25%;
    font-size:22px;
    animation-duration:12s;
    animation-delay:2s;
}

.leaf:nth-child(3){
    left:50%;
    font-size:28px;
    animation-duration:10s;
    animation-delay:3s;
}

.leaf:nth-child(4){
    left:75%;
    font-size:22px;
    animation-duration:13s;
    animation-delay:1s;
}

.leaf:nth-child(5){
    left:92%;
    font-size:32px;
    animation-duration:11s;
    animation-delay:4s;
}

@keyframes jatuh{

    0%{
        top:-80px;
        transform:translateX(0) rotate(0deg);
    }

    50%{
        transform:translateX(70px) rotate(180deg);
    }

    100%{
        top:110vh;
        transform:translateX(-50px) rotate(360deg);
    }

}

.login-card{
    width:100%;
    max-width:470px;

    padding:45px 40px;

    background:white;

    border-radius:30px;

    text-align:center;

    position:relative;
    z-index:5;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

.admin-icon{
    width:90px;
    height:90px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#eaf3d2;

    border:3px solid #d9ef70;

    color:#12603e;

    font-size:38px;
}

.login-card h1{
    font-family:'DM Serif Display',serif;

    color:#12603e;

    font-size:42px;

    margin-bottom:8px;
}

.login-card p{
    color:#718275;

    font-family:'Playfair Display',serif;

    font-style:italic;

    margin-bottom:28px;
}

.decor{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:12px;

    margin-bottom:25px;
}

.decor span{
    width:55px;
    height:2px;

    background:#d5b958;
}

.decor i{
    color:#b49637;
}

.input-group{
    text-align:left;
    margin-bottom:20px;
}

.input-group label{
    display:block;

    margin-bottom:8px;

    font-size:14px;
    font-weight:600;

    color:#315c48;
}

.input-box{
    position:relative;
}

.lock-icon{
    position:absolute;

    left:17px;
    top:50%;

    transform:translateY(-50%);

    color:#639276;

    z-index:3;

    pointer-events:none;
}

.input-box input{
    width:100%;
    height:52px;

    padding:0 55px 0 48px;

    border:2px solid #dce7df;

    border-radius:15px;

    outline:none;

    background:white;

    color:#174f36;

    font-family:'Montserrat',sans-serif;

    font-size:15px;

    position:relative;
    z-index:1;
}

.input-box input:focus{
    border-color:#4f956f;

    box-shadow:
        0 0 0 4px rgba(79,149,111,.1);
}

.show-password{
    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    border:0;

    background:transparent;

    color:#789184;

    cursor:pointer;

    z-index:5;

    border-radius:10px;
}

.show-password:hover{
    background:#edf4ef;
    color:#12603e;
}

.login-btn{
    width:100%;

    padding:16px;

    border:0;

    border-radius:17px;

    background:#12603e;

    color:white;

    font-family:'Montserrat',sans-serif;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.login-btn:hover{
    background:#0d4b30;
    transform:translateY(-3px);
}

.message{
    min-height:25px;

    margin-top:17px;

    font-size:14px;

    font-weight:700;
}

.error{
    color:#c74b4b;
}


/* =========================
   DASHBOARD
========================= */

#dashboardPage{
    display:none;

    min-height:100vh;

    background:#f5f7f2;
}

/* NAVBAR */

.dashboard-nav{
    height:75px;

    padding:0 6%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:#064d2f;

    color:white;
}

.dashboard-logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-family:'Playfair Display',serif;

    font-size:22px;
    font-weight:700;
}

.dashboard-logo i{
    color:#d9ef70;
    font-size:28px;
}

.logout-btn{
    border:1px solid rgba(255,255,255,.4);

    background:transparent;

    color:white;

    padding:10px 17px;

    border-radius:25px;

    cursor:pointer;

    font-family:'Montserrat',sans-serif;

    font-weight:600;
}

.logout-btn:hover{
    background:#f1d878;
    color:#145334;
}


/* CONTENT */

.dashboard-content{
    width:88%;
    max-width:1250px;

    margin:40px auto 70px;
}

.dashboard-title{
    margin-bottom:30px;
}

.dashboard-title h1{
    font-family:'DM Serif Display',serif;

    font-size:42px;

    color:#12603e;

    margin-bottom:6px;
}

.dashboard-title p{
    color:#6d8175;

    font-size:14px;
}


/* STAT CARD */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:35px;
}

.stat-card{
    background:white;

    border-radius:20px;

    padding:25px;

    display:flex;

    align-items:center;

    gap:18px;

    box-shadow:
        0 8px 25px rgba(30,80,55,.08);

    border:1px solid #e4ece5;
}

.stat-icon{
    width:55px;
    height:55px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eaf3d2;

    color:#12603e;

    font-size:23px;
}

.stat-card h3{
    font-size:13px;

    color:#75877c;

    margin-bottom:5px;
}

.stat-card strong{
    font-size:27px;

    color:#12603e;
}


/* TOOLBAR */

.guestbook-section{
    background:white;

    border-radius:24px;

    padding:28px;

    box-shadow:
        0 8px 25px rgba(30,80,55,.08);

    border:1px solid #e4ece5;
}

.section-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.section-header h2{
    font-family:'DM Serif Display',serif;

    font-size:30px;

    color:#12603e;
}

.search-box{
    position:relative;

    width:260px;
}

.search-box i{
    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:#789184;
}

.search-box input{
    width:100%;

    padding:12px 15px 12px 40px;

    border:2px solid #e1e9e3;

    border-radius:13px;

    outline:none;

    font-family:'Montserrat',sans-serif;
}

.search-box input:focus{
    border-color:#4f956f;
}


/* TABLE */

.table-wrapper{
    width:100%;

    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:850px;
}

thead{
    background:#edf4ef;
}

th{
    text-align:left;

    padding:15px 13px;

    color:#315c48;

    font-size:13px;

    white-space:nowrap;
}

td{
    padding:15px 13px;

    border-bottom:1px solid #edf1ed;

    color:#536c5e;

    font-size:13px;

    vertical-align:top;
}

tbody tr:hover{
    background:#fafcf9;
}

.status{
    display:inline-block;

    padding:6px 10px;

    border-radius:20px;

    font-size:11px;

    font-weight:700;

    background:#e8f4df;

    color:#287048;
}

.action-btn{
    border:0;

    padding:8px 11px;

    border-radius:9px;

    cursor:pointer;

    margin-right:4px;

    background:#edf4ef;

    color:#12603e;
}

.action-btn:hover{
    background:#dcebe1;
}

.delete-btn{
    color:#c74b4b;
}

.empty{
    text-align:center;

    padding:35px;

    color:#8a9990;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.5);

    z-index:100;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal-box{
    width:100%;
    max-width:500px;

    background:white;

    border-radius:22px;

    padding:30px;

    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h3{
    font-family:'DM Serif Display',serif;

    color:#12603e;

    font-size:27px;
}

.close-modal{
    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:#edf4ef;

    color:#12603e;

    cursor:pointer;
}

.modal-content p{
    margin-bottom:13px;

    color:#536c5e;

    font-size:14px;

    line-height:1.6;
}

.modal-content strong{
    color:#174f36;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .login-card{
        padding:35px 24px;
    }

    .login-card h1{
        font-size:35px;
    }

    .dashboard-nav{
        padding:0 20px;
    }

    .dashboard-logo{
        font-size:18px;
    }

    .dashboard-logo i{
        font-size:23px;
    }

    .dashboard-content{
        width:92%;

        margin-top:30px;
    }

    .dashboard-title h1{
        font-size:35px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .guestbook-section{
        padding:20px 15px;
    }

    .section-header{
        align-items:flex-start;

        flex-direction:column;
    }

    .search-box{
        width:100%;
    }

}

</style>
</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<section id="loginPage">

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>

    <div class="leaf">
        <i class="fa-solid fa-leaf"></i>
    </div>


    <div class="login-card">

        <div class="admin-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Admin</h1>

        <p>
            Panel Pengelolaan Desa Maktangguk
        </p>

        <div class="decor">

            <span></span>

            <i class="fa-solid fa-leaf"></i>

            <span></span>

        </div>


        <form onsubmit="loginAdmin(event)">

            <div class="input-group">

                <label for="password">
                    Password Admin
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock lock-icon"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="off"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">

                        <i
                            class="fa-solid fa-eye"
                            id="eye">
                        </i>

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Masuk sebagai Admin

            </button>

        </form>


        <div
            id="loginMessage"
            class="message">
        </div>

    </div>

</section>


<!-- =========================
     DASHBOARD ADMIN
========================= -->

<section id="dashboardPage">

    <nav class="dashboard-nav">

        <div class="dashboard-logo">

            <i class="fa-solid fa-leaf"></i>

            Desa Maktangguk

        </div>

        <button
            class="logout-btn"
            onclick="logoutAdmin()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Keluar

        </button>

    </nav>


    <main class="dashboard-content">

        <div class="dashboard-title">

            <h1>
                Dashboard Admin
            </h1>

            <p>
                Kelola data Buku Tamu Desa Maktangguk
            </p>

        </div>


        <!-- STATISTIK -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-users"></i>

                </div>

                <div>

                    <h3>
                        Total Tamu
                    </h3>

                    <strong id="totalData">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-envelope"></i>

                </div>

                <div>

                    <h3>
                        Total Pesan
                    </h3>

                    <strong id="totalPesan">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-comments"></i>

                </div>

                <div>

                    <h3>
                        Tanggapan
                    </h3>

                    <strong id="totalTanggapan">
                        0
                    </strong>

                </div>

            </div>

        </div>


        <!-- BUKU TAMU -->

        <section class="guestbook-section">

            <div class="section-header">

                <h2>
                    Buku Tamu
                </h2>

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari nama atau pesan..."
                        onkeyup="searchData()"
                    >

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Nama
                            </th>

                            <th>
                                Asal
                            </th>

                            <th>
                                Pesan
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>

                    <tbody id="guestbookBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</section>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="detailModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                Detail Pesan
            </h3>

            <button
                class="close-modal"
                onclick="closeModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div
            class="modal-content"
            id="modalContent">
        </div>

    </div>

</div>


<script>

/* =========================
   DATA CONTOH
========================= */

let guestbookData = [

    {
        nama:"Contoh Nama",
        asal:"Desa Maktangguk",
        pesan:"Selamat datang di website Desa Maktangguk.",
        status:"Baru",
        tanggapan:"Belum ada tanggapan."
    }

];


/* =========================
   LOGIN
========================= */

function loginAdmin(event){

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(password === "Rafa2009"){

        message.className =
            "message";

        message.style.color =
            "#258052";

        message.innerHTML =
            "✅ Password Benar";

        setTimeout(function(){

            document.getElementById("loginPage").style.display =
                "none";

            document.getElementById("dashboardPage").style.display =
                "block";

            document.getElementById("password").value = "";

            loadDashboard();

        },500);

    }else{

        message.className =
            "message error";

        message.innerHTML =
            "❌ Password Salah";

        document.getElementById("password").value = "";

    }

}


/* =========================
   SHOW PASSWORD
========================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");

        eye.classList.add("fa-eye-slash");

    }else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");

        eye.classList.add("fa-eye");

    }

}


/* =========================
   DASHBOARD
========================= */

function loadDashboard(){

    const body =
        document.getElementById("guestbookBody");

    body.innerHTML = "";

    document.getElementById("totalData").innerText =
        guestbookData.length;

    document.getElementById("totalPesan").innerText =
        guestbookData.length;

    const tanggapan =
        guestbookData.filter(
            item => item.tanggapan !== "Belum ada tanggapan."
        ).length;

    document.getElementById("totalTanggapan").innerText =
        tanggapan;


    if(guestbookData.length === 0){

        body.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Belum ada data Buku Tamu.
                </td>
            </tr>
        `;

        return;

    }


    guestbookData.forEach(function(item,index){

        body.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>${escapeHTML(item.nama)}</strong>
                </td>

                <td>
                    ${escapeHTML(item.asal)}
                </td>

                <td>
                    ${escapeHTML(item.pesan)}
                </td>

                <td>

                    <span class="status">
                        ${escapeHTML(item.status)}
                    </span>

                </td>

                <td>

                    <button
                        class="action-btn"
                        onclick="lihatPesan(${index})">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="hapusData(${index})">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                </td>

            </tr>

        `;

    });

}


/* =========================
   LIHAT PESAN
========================= */

function lihatPesan(index){

    const item =
        guestbookData[index];

    document.getElementById("modalContent").innerHTML = `

        <p>
            <strong>Nama:</strong><br>
            ${escapeHTML(item.nama)}
        </p>

        <p>
            <strong>Asal:</strong><br>
            ${escapeHTML(item.asal)}
        </p>

        <p>
            <strong>Pesan:</strong><br>
            ${escapeHTML(item.pesan)}
        </p>

        <p>
            <strong>Status:</strong><br>
            ${escapeHTML(item.status)}
        </p>

        <p>
            <strong>Tanggapan:</strong><br>
            ${escapeHTML(item.tanggapan)}
        </p>

    `;

    document.getElementById("detailModal").style.display =
        "flex";

}


/* =========================
   TUTUP MODAL
========================= */

function closeModal(){

    document.getElementById("detailModal").style.display =
        "none";

}


/* =========================
   HAPUS DATA
========================= */

function hapusData(index){

    const yakin =
        confirm("Apakah kamu yakin ingin menghapus data ini?");

    if(!yakin){
        return;
    }

    guestbookData.splice(index,1);

    loadDashboard();

}


/* =========================
   SEARCH
========================= */

function searchData(){

    const keyword =
        document.getElementById("searchInput").value.toLowerCase();

    const rows =
        document.querySelectorAll("#guestbookBody tr");

    rows.forEach(function(row){

        const text =
            row.innerText.toLowerCase();

        if(text.includes(keyword)){

            row.style.display = "";

        }else{

            row.style.display = "none";

        }

    });

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

    document.getElementById("dashboardPage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("loginMessage").innerHTML =
        "";

}


/* =========================
   AMANKAN TEKS
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   KLIK LUAR MODAL
========================= */

window.onclick = function(event){

    const modal =
        document.getElementById("detailModal");

    if(event.target === modal){

        closeModal();

    }

};

</script>

</body>
</html>
